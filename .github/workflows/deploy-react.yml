name: Build and Deploy React

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: rishavcse1/rssb-react:${{ github.sha }}
          build-args: |
            REACT_APP_API_URL=/api

      - name: Deploy React to Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 161.118.167.160
          username: ubuntu
          key: ${{ secrets.KUBE_SSH_KEY }}
          script: |
            kubectl set image deployment/react \
              react=rishavcse1/rssb-react:${{ github.sha }}

            kubectl rollout status deployment/react --timeout=180s

            kubectl get deployment react
            kubectl get pods -l app=react