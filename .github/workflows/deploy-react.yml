name: Build and Deploy React

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg REACT_APP_API_URL=/api \
            -t rishavcse1/rssb-react:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push rishavcse1/rssb-react:${{ github.sha }}

      - name: Deploy React to Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 161.118.167.160
          username: ubuntu
          key: ${{ secrets.KUBE_SSH_KEY }}
          script: |
            kubectl set image deployment/react \
              react=rishavcse1/rssb-react:${{ github.sha }}

            kubectl rollout status deployment/react --timeout=180s

            kubectl get deployment react
            kubectl get pods -l app=react